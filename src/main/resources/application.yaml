spring:
  application:
    name: recruitment-mcp-server

  # ── Spring AI MCP Server (Streamable HTTP transport via WebMVC) ─────────────
  ai:
    mcp:
      server:
        type: ASYNC
        name: recruitment-mcp-server
        version: 1.0.0
        protocol: streamable       # Streamable HTTP (replaces legacy SSE)

    # ── OpenAI Configuration - Using OpenAI SDK for Claude Haiku access ─────────
    # Note: Configure with Anthropic API key and Claude model name
    openai:
      api-key: ${ANTHROPIC_API_KEY:sk-ant-}
      base-url: ${ANTHROPIC_API_BASE_URL:https://api.anthropic.com/v1}
      model:
        name: ${LLM_MODEL:claude-3-5-haiku-20241022}  # Claude Haiku model for fast processing

  main:
    banner-mode: "off"   # Disable Spring Boot startup banner

# ── Server port ──────────────────────────────────────────────────────────────
server:
  port: 8080

# ── Zoho Recruit Configuration ────────────────────────────────────────────────
zoho:
  recruit:
    client-id: ${ZOHO_RECRUIT_CLIENT_ID:your-client-id}
    client-secret: ${ZOHO_RECRUIT_CLIENT_SECRET:your-client-secret}
    refresh-token: ${ZOHO_RECRUIT_REFRESH_TOKEN:your-refresh-token}
    organization-id: ${ZOHO_RECRUIT_ORG_ID:your-org-id}
    api-url: ${ZOHO_RECRUIT_API_URL:https://recruit.zoho.com/api/v2}

# ── AI Enhanced Recruitment Configuration ──────────────────────────────────
recruitment:
  ai:
    enabled: true
    use-semantic-matching: true
    confidence-threshold: 0.65
    max-skill-suggestions: 5
    enable-jd-optimization: true
    model-provider: anthropic-claude  # Using Claude Haiku for intelligent analysis

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.mcp.mcp_server: DEBUG
    org.springframework.ai: DEBUG
  file:
    name: ${user.home}/logs/mcp-server.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
